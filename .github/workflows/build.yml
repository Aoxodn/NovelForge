name: build

# 三平台构建矩阵（审查跨平台项）：推送到 main 或手动触发时，
# 在 Windows / macOS / Linux 各出一份安装包并作为构建产物上传。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--config tauri.windows.conf.json'
          - platform: macos-latest
            args: '--config tauri.macos.conf.json'
          - platform: ubuntu-latest
            args: '--config tauri.linux.conf.json'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 前端检查与测试
        run: |
          npx tsc --noEmit
          npm test

      - name: 构建 Tauri 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          releaseName: ''
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NovelForge-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
